<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>OpenMusic</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #000000;
      --bg-elev: #101010;
      --surface: #151515;
      --surface-2: #1d1d1d;
      --text-primary: #ffffff;
      --text-secondary: #b3b3b3;
      --text-tertiary: #6f6f6f;
      --border: rgba(255, 255, 255, 0.06);
      --border-strong: rgba(255, 255, 255, 0.1);
      --accent: #1db954;
      --accent-contrast: #000000;
      --r-sm: 8px;
      --r-md: 10px;
      --r-lg: 12px;
      --r-pill: 999px;
      color-scheme: dark;
    }

    :root[data-accent="green"] {
      --accent: #1db954;
    }

    :root[data-accent="blue"] {
      --accent: #3b82f6;
    }

    :root[data-accent="violet"] {
      --accent: #8b5cf6;
    }

    :root[data-accent="orange"] {
      --accent: #f59e0b;
    }

    :root[data-accent="red"] {
      --accent: #ef4444;
    }

    :root[data-accent="cyan"] {
      --accent: #22d3ee;
    }

    :root[data-accent="pink"] {
      --accent: #ec4899;
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.4;
    }

    button,
    input {
      font: inherit;
      color: inherit;
    }

    button {
      border: none;
      background: none;
      cursor: pointer;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 430px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 0) + 12px) 16px 10px 16px;
      gap: 12px;
    }

    .app-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--r-pill);
      color: var(--text-secondary);
    }

    .icon-btn:active {
      opacity: 0.7;
    }

    .app-main {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 4px 16px 110px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .app-main::-webkit-scrollbar {
      display: none;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 9px 12px;
    }

    .search svg {
      width: 18px;
      height: 18px;
      color: var(--text-tertiary);
      flex-shrink: 0;
    }

    .search input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 14px;
      outline: none;
    }

    .search input::placeholder {
      color: var(--text-tertiary);
    }

    .track-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .track {
      display: grid;
      grid-template-columns: 48px 1fr auto auto;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      border-radius: var(--r-md);
      text-align: left;
    }

    .track:active {
      background: var(--surface);
    }

    .thumb {
      width: 48px;
      height: 48px;
      border-radius: var(--r-sm);
      background: var(--surface-2);
      display: grid;
      place-items: center;
      color: var(--text-primary);
      font-size: 18px;
    }

    .track-meta {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .track-meta strong {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-meta span {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .duration {
      font-size: 13px;
      color: var(--text-tertiary);
    }

    .heart {
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
    }

    .heart.saved {
      color: var(--accent);
    }

    .player {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: calc(env(safe-area-inset-bottom, 0) + 12px);
      display: grid;
      grid-template-columns: 40px 1fr auto;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 6px 10px 6px 6px;
    }

    .player-thumb {
      width: 40px;
      height: 40px;
      border-radius: var(--r-sm);
      background: var(--surface-2);
      display: grid;
      place-items: center;
    }

    .player-meta {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .player-title {
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-artist {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-toggle {
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--r-pill);
    }

    .player-toggle:active {
      opacity: 0.7;
    }

    .settings-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      z-index: 10;
    }

    .settings-overlay.hidden {
      display: none;
    }

    .settings-sheet {
      width: 100%;
      max-width: 430px;
      background: var(--bg-elev);
      border-radius: 16px 16px 0 0;
      border: 1px solid var(--border);
      border-bottom: none;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-bottom: calc(env(safe-area-inset-bottom, 0) + 12px);
    }

    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px 16px;
    }

    .settings-title {
      font-size: 15px;
      font-weight: 600;
    }

    .settings-content {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 6px 16px 10px 16px;
    }

    .settings-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .settings-group-title {
      font-size: 14px;
      font-weight: 500;
    }

    .settings-group-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    .color-swatch {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: var(--r-pill);
      position: relative;
    }

    .color-swatch.active::after {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: var(--r-pill);
      border: 2px solid rgba(0, 0, 0, 0.8);
    }

    .color-swatch[data-color="green"] {
      background: #1db954;
    }

    .color-swatch[data-color="blue"] {
      background: #3b82f6;
    }

    .color-swatch[data-color="violet"] {
      background: #8b5cf6;
    }

    .color-swatch[data-color="orange"] {
      background: #f59e0b;
    }

    .color-swatch[data-color="red"] {
      background: #ef4444;
    }

    .color-swatch[data-color="cyan"] {
      background: #22d3ee;
    }

    .color-swatch[data-color="pink"] {
      background: #ec4899;
    }

    .empty {
      color: var(--text-secondary);
      font-size: 13px;
      text-align: center;
      padding: 20px 0;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="app-header">
      <div class="app-title">OpenMusic</div>
      <button class="icon-btn" id="open-settings" aria-label="Настройки">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c0 .66.26 1.3.73 1.77.47.47 1.11.73 1.77.73H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
          </path>
        </svg>
      </button>
    </header>

    <main class="app-main">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="search" placeholder="Поиск трека или исполнителя" autocomplete="off" spellcheck="false">
      </label>

      <div class="section-header">
        <div class="section-title">Треки</div>
        <button class="icon-btn" id="showSaved" aria-label="Избранное">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8z">
            </path>
          </svg>
        </button>
      </div>

      <div class="track-list" id="tracks"></div>
      <div class="empty hidden" id="empty">Ничего не найдено</div>
    </main>

    <div class="player">
      <div class="player-thumb" id="currentThumb">♫</div>
      <div class="player-meta">
        <div class="player-title" id="currentTitle">Выбери трек</div>
        <div class="player-artist" id="currentArtist">OpenMusic</div>
      </div>
      <button class="player-toggle" id="toggle">
        <svg id="iconPlay" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <svg id="iconPause" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16"></rect>
          <rect x="14" y="4" width="4" height="16"></rect>
        </svg>
      </button>
    </div>

    <div class="settings-overlay hidden" id="settings-overlay">
      <div class="settings-sheet">
        <header class="settings-header">
          <span class="settings-title">Настройки</span>
          <button class="icon-btn" id="settings-close" aria-label="Закрыть">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </header>
        <div class="settings-content">
          <div class="settings-group">
            <div class="settings-group-title">Цвет оформления</div>
            <p class="settings-group-subtitle">Меняет только акцентные элементы</p>
            <div class="color-grid" id="color-grid"></div>
          </div>
        </div>
      </div>
    </div>

    <audio id="audio" preload="none"></audio>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
        tg.setHeaderColor("#000000");
        tg.setBackgroundColor("#000000");
      } catch (e) { }
    }

    const STORAGE_KEY = "openmusic-accent";
    const root = document.documentElement;
    const openBtn = document.getElementById("open-settings");
    const overlay = document.getElementById("settings-overlay");
    const closeBtn = document.getElementById("settings-close");
    const grid = document.getElementById("color-grid");

    const COLORS = [
      { id: "green", label: "Зелёный" },
      { id: "blue", label: "Синий" },
      { id: "violet", label: "Фиолетовый" },
      { id: "orange", label: "Оранжевый" },
      { id: "red", label: "Красный" },
      { id: "cyan", label: "Циановый" },
      { id: "pink", label: "Розовый" }
    ];

    function applyAccent(id) {
      root.setAttribute("data-accent", id);
      localStorage.setItem(STORAGE_KEY, id);
      updateActive(id);
    }

    function updateActive(id) {
      grid.querySelectorAll(".color-swatch").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.color === id);
      });
    }

    function initSettings() {
      const saved = localStorage.getItem(STORAGE_KEY) || "green";
      root.setAttribute("data-accent", saved);
      grid.innerHTML = "";
      COLORS.forEach((color) => {
        const btn = document.createElement("button");
        btn.className = "color-swatch";
        btn.dataset.color = color.id;
        btn.setAttribute("aria-label", color.label);
        btn.addEventListener("click", () => applyAccent(color.id));
        grid.appendChild(btn);
      });
      updateActive(saved);
      openBtn.addEventListener("click", () => overlay.classList.remove("hidden"));
      closeBtn.addEventListener("click", () => overlay.classList.add("hidden"));
      overlay.addEventListener("click", (e) => {
        if (e.target === overlay) overlay.classList.add("hidden");
      });
    }

    const tracksData = [
      { id: 1, title: "Blue Horizon", artist: "Open Waves", duration: "3:24", url: "https://archive.org/download/MLKDream/MLKDream_64kb.mp3" },
      { id: 2, title: "Midnight City Lights", artist: "The Ambient Project", duration: "4:02", url: "https://archive.org/download/testmp3testfile/mpthreetest.mp3" },
      { id: 3, title: "Ocean in Motion", artist: "Free Music Archive", duration: "2:48", url: "https://archive.org/download/MLKDream/MLKDream_64kb.mp3" },
      { id: 4, title: "Soft Focus", artist: "Open Waves", duration: "3:51", url: "https://archive.org/download/testmp3testfile/mpthreetest.mp3" },
      { id: 5, title: "Afterglow", artist: "Indie Sound Lab", duration: "3:17", url: "https://archive.org/download/MLKDream/MLKDream_64kb.mp3" },
      { id: 6, title: "Pulse Runner", artist: "Free Music Archive", duration: "2:59", url: "https://archive.org/download/testmp3testfile/mpthreetest.mp3" },
      { id: 7, title: "Slow Motion", artist: "Open Waves", duration: "3:32", url: "https://archive.org/download/MLKDream/MLKDream_64kb.mp3" },
      { id: 8, title: "Neon Lines", artist: "Indie Sound Lab", duration: "3:06", url: "https://archive.org/download/testmp3testfile/mpthreetest.mp3" }
    ];

    const audio = document.getElementById("audio");
    const tracksEl = document.getElementById("tracks");
    const search = document.getElementById("search");
    const showSaved = document.getElementById("showSaved");
    const currentTitle = document.getElementById("currentTitle");
    const currentArtist = document.getElementById("currentArtist");
    const currentThumb = document.getElementById("currentThumb");
    const toggle = document.getElementById("toggle");
    const iconPlay = document.getElementById("iconPlay");
    const iconPause = document.getElementById("iconPause");
    const empty = document.getElementById("empty");

    const SAVED_KEY = "openmusic-saved";
    let saved = new Set(JSON.parse(localStorage.getItem(SAVED_KEY) || "[]"));
    let currentId = null;
    let savedOnly = false;
    let searchTerm = "";

    function saveSaved() {
      localStorage.setItem(SAVED_KEY, JSON.stringify(Array.from(saved)));
    }

    function filtered() {
      return tracksData.filter(t => {
        const matchSearch = `${t.title} ${t.artist}`.toLowerCase().includes(searchTerm.toLowerCase());
        const matchSaved = savedOnly ? saved.has(t.id) : true;
        return matchSearch && matchSaved;
      });
    }

    function render() {
      const list = filtered();
      tracksEl.innerHTML = "";
      if (!list.length) {
        empty.classList.remove("hidden");
      } else {
        empty.classList.add("hidden");
        list.forEach(t => {
          const row = document.createElement("button");
          row.className = "track";
          row.innerHTML = `
            <div class="thumb">♫</div>
            <div class="track-meta">
              <strong>${t.title}</strong>
              <span>${t.artist}</span>
            </div>
            <div class="duration">${t.duration}</div>
            <button class="heart ${saved.has(t.id) ? "saved" : ""}" data-save="${t.id}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="${saved.has(t.id) ? "currentColor" : "none"}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8z"></path>
              </svg>
            </button>
          `;
          row.addEventListener("click", (e) => {
            if (e.target.closest("[data-save]")) return;
            playTrack(t.id);
          });
          const saveBtn = row.querySelector("[data-save]");
          saveBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (saved.has(t.id)) saved.delete(t.id); else saved.add(t.id);
            saveSaved();
            render();
            if (currentId === t.id) {
              const h = document.querySelector(".heart.saved, .heart:not(.saved)");
            }
          });
          tracksEl.appendChild(row);
        });
      }
      showSaved.style.color = savedOnly ? "var(--accent)" : "var(--text-secondary)";
    }

    function playTrack(id) {
      const t = tracksData.find(x => x.id === id);
      if (!t) return;
      currentId = t.id;
      currentTitle.textContent = t.title;
      currentArtist.textContent = t.artist;
      if (audio.dataset.track !== String(t.id)) {
        audio.src = t.url;
        audio.dataset.track = String(t.id);
        audio.load();
      }
      audio.play().then(() => {
        iconPlay.classList.add("hidden");
        iconPause.classList.remove("hidden");
      }).catch(() => {
        iconPlay.classList.remove("hidden");
        iconPause.classList.add("hidden");
      });
      render();
    }

    toggle.addEventListener("click", () => {
      if (!currentId) {
        playTrack(tracksData[0].id);
        return;
      }
      if (audio.paused) {
        audio.play().then(() => {
          iconPlay.classList.add("hidden");
          iconPause.classList.remove("hidden");
        });
      } else {
        audio.pause();
        iconPlay.classList.remove("hidden");
        iconPause.classList.add("hidden");
      }
    });

    audio.addEventListener("play", () => {
      iconPlay.classList.add("hidden");
      iconPause.classList.remove("hidden");
    });
    audio.addEventListener("pause", () => {
      iconPlay.classList.remove("hidden");
      iconPause.classList.add("hidden");
    });
    audio.addEventListener("ended", () => {
      iconPlay.classList.remove("hidden");
      iconPause.classList.add("hidden");
    });

    search.addEventListener("input", (e) => {
      searchTerm = e.target.value;
      render();
    });

    showSaved.addEventListener("click", () => {
      savedOnly = !savedOnly;
      render();
    });

    initSettings();
    render();
  </script>
</body>

</html>
