<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>OpenMusic</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #000000;
      --surface: #151515;
      --surface-2: #1d1d1d;
      --text-primary: #ffffff;
      --text-secondary: #b3b3b3;
      --text-tertiary: #6f6f6f;
      --border: rgba(255, 255, 255, 0.06);
      --accent: #1db954;
      --accent-contrast: #000000;
      --r-sm: 8px;
      --r-md: 10px;
      --r-lg: 12px;
      --r-pill: 999px;
      color-scheme: dark;
    }

    :root[data-accent="green"] { --accent: #1db954; }
    :root[data-accent="blue"] { --accent: #3b82f6; }
    :root[data-accent="violet"] { --accent: #8b5cf6; }
    :root[data-accent="orange"] { --accent: #f59e0b; }
    :root[data-accent="red"] { --accent: #ef4444; }
    :root[data-accent="cyan"] { --accent: #22d3ee; }
    :root[data-accent="pink"] { --accent: #ec4899; }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.4;
    }

    button, input {
      font: inherit;
      color: inherit;
      border: none;
      background: none;
    }

    button { cursor: pointer; }

    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 430px;
      margin: 0 auto;
      overflow: hidden;
      position: relative;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 0) + 12px) 16px 8px 16px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .brand-top {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .brand-sub {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.6px;
      color: var(--accent);
    }

    .header-actions {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--r-pill);
      color: var(--text-secondary);
    }

    .icon-btn.active { color: var(--accent); }

    main {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 0 16px 110px 16px;
    }

    main::-webkit-scrollbar { display: none; }

    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 9px 12px;
    }

    .search:focus-within {
      border-color: color-mix(in srgb, var(--accent) 55%, transparent);
    }

    .search svg {
      width: 18px;
      height: 18px;
      color: var(--text-tertiary);
    }

    .search:focus-within svg { color: var(--accent); }

    .search input {
      flex: 1;
      background: transparent;
      outline: none;
      font-size: 14px;
    }

    .search input::placeholder { color: var(--text-tertiary); }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
    }

    .status {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .track {
      display: grid;
      grid-template-columns: 48px 1fr auto auto;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      border-radius: var(--r-md);
      text-align: left;
    }

    .track:active { background: var(--surface); }

    .track.active {
      background: radial-gradient(120% 120% at 0% 50%, color-mix(in srgb, var(--accent) 14%, transparent), transparent);
    }

    .track.active .track-name { color: var(--accent); }

    .cover {
      width: 48px;
      height: 48px;
      border-radius: var(--r-sm);
      background: var(--surface-2);
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
    }

    .meta {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .track-name {
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .time {
      font-size: 13px;
      color: var(--text-tertiary);
    }

    .fav {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
    }

    .fav.active { color: var(--accent); }

    .player {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: calc(env(safe-area-inset-bottom, 0) + 12px);
      display: grid;
      grid-template-columns: 40px 1fr auto;
      align-items: center;
      gap: 10px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 16%, var(--surface)) 0%, var(--surface) 100%);
      border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border));
      border-radius: var(--r-lg);
      padding: 6px 10px 6px 6px;
    }

    .player-cover {
      width: 40px;
      height: 40px;
      border-radius: var(--r-sm);
      background: var(--surface-2);
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-meta {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .player-name {
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-artist {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .play-btn {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--r-pill);
      background: var(--accent);
      color: var(--accent-contrast);
    }

    .sheet {
      position: absolute;
      inset: 0;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      z-index: 10;
    }

    .sheet.show { display: flex; }

    .sheet-inner {
      width: 100%;
      max-width: 430px;
      background: #101010;
      border-radius: 16px 16px 0 0;
      border: 1px solid var(--border);
      border-bottom: none;
      padding: 14px 16px calc(env(safe-area-inset-bottom, 0) + 14px) 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sheet-title {
      font-weight: 600;
    }

    .colors {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    .swatch {
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: var(--r-pill);
      position: relative;
    }

    .swatch.active::after {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: var(--r-pill);
      border: 2px solid rgba(0, 0, 0, 0.8);
    }

    .swatch.g { background: #1db954; }
    .swatch.b { background: #3b82f6; }
    .swatch.v { background: #8b5cf6; }
    .swatch.o { background: #f59e0b; }
    .swatch.r { background: #ef4444; }
    .swatch.c { background: #22d3ee; }
    .swatch.p { background: #ec4899; }

    .hidden { display: none !important; }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="brand-top">
          <div class="brand-name">OpenMusic</div>
          <div class="brand-sub">ОНЛАЙН-КАТАЛОГ</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btn-fav" aria-label="Избранное">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8z"></path>
          </svg>
        </button>
        <button class="icon-btn" id="btn-settings" aria-label="Настройки">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c0 .66.26 1.3.73 1.77.47.47 1.11.73 1.77.73H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <main>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="q" placeholder="Поиск трека или исполнителя" autocomplete="off">
      </label>

      <section id="home">
        <div class="section-head">
          <div class="section-title">Топ чарт</div>
          <div class="status" id="status">Загружаем каталог...</div>
        </div>
        <div class="list" id="chart"></div>
      </section>

      <section id="searchsec" class="hidden">
        <div class="section-head">
          <div class="section-title">Результаты</div>
        </div>
        <div class="list" id="results"></div>
      </section>

      <section id="favsec" class="hidden">
        <div class="section-head">
          <div class="section-title">Избранное</div>
        </div>
        <div class="list" id="favs"></div>
      </section>
    </main>

    <div class="player">
      <div class="player-cover" id="pcover">♫</div>
      <div class="player-meta">
        <div class="player-name" id="pname">Выбери трек</div>
        <div class="player-artist" id="partist">OpenMusic</div>
      </div>
      <button class="play-btn" id="pp">
        <svg id="pplay" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <svg id="ppause" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16"></rect>
          <rect x="14" y="4" width="4" height="16"></rect>
        </svg>
      </button>
    </div>

    <div class="sheet" id="sheet">
      <div class="sheet-inner">
        <div class="sheet-head">
          <div class="sheet-title">Настройки</div>
          <button class="icon-btn" id="sclose">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="sheet-title" style="font-size:14px;">Цвет оформления</div>
        <div class="colors">
          <button class="swatch g" data-c="green"></button>
          <button class="swatch b" data-c="blue"></button>
          <button class="swatch v" data-c="violet"></button>
          <button class="swatch o" data-c="orange"></button>
          <button class="swatch r" data-c="red"></button>
          <button class="swatch c" data-c="cyan"></button>
          <button class="swatch p" data-c="pink"></button>
        </div>
      </div>
    </div>

    <template id="t">
      <button class="track">
        <div class="cover">♫</div>
        <div class="meta">
          <div class="track-name"></div>
          <div class="track-artist"></div>
        </div>
        <div class="time"></div>
        <button class="fav">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8z"></path>
          </svg>
        </button>
      </button>
    </template>

    <audio id="aud"></audio>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if(tg){ try{ tg.ready(); tg.expand(); tg.setHeaderColor("#000000"); tg.setBackgroundColor("#000000"); }catch(e){} }

    const root = document.documentElement;
    const btnSet = document.getElementById("btn-settings");
    const btnFav = document.getElementById("btn-fav");
    const sheet = document.getElementById("sheet");
    const sclose = document.getElementById("sclose");
    const sw = document.querySelectorAll(".swatch");
    const q = document.getElementById("q");
    const home = document.getElementById("home");
    const searchsec = document.getElementById("searchsec");
    const favsec = document.getElementById("favsec");
    const chart = document.getElementById("chart");
    const results = document.getElementById("results");
    const favs = document.getElementById("favs");
    const status = document.getElementById("status");
    const pcover = document.getElementById("pcover");
    const pname = document.getElementById("pname");
    const partist = document.getElementById("partist");
    const pp = document.getElementById("pp");
    const pplay = document.getElementById("pplay");
    const ppause = document.getElementById("ppause");
    const aud = document.getElementById("aud");
    const tpl = document.getElementById("t");

    const AKEY = "om-accent";
    const FKEY = "om-fav";
    let fav = new Set(JSON.parse(localStorage.getItem(FKEY)||"[]"));
    let list = [];
    let current = null;

    function setAccent(c){
      root.setAttribute("data-accent", c);
      localStorage.setItem(AKEY,c);
      sw.forEach(x=>x.classList.toggle("active", x.dataset.c===c));
    }
    setAccent(localStorage.getItem(AKEY)||"green");
    sw.forEach(x=>x.onclick=()=>setAccent(x.dataset.c));
    btnSet.onclick=()=>sheet.classList.add("show");
    sclose.onclick=()=>sheet.classList.remove("show");
    sheet.onclick=e=>{ if(e.target===sheet) sheet.classList.remove("show"); }

    function fmt(s){
      if(!s||isNaN(s)) return "";
      s=Math.floor(s);
      const m=Math.floor(s/60), sec=s%60;
      return m+":"+(sec<10?"0"+sec:sec);
    }

    function mk(track, cont){
      const n=tpl.content.cloneNode(true);
      const row=n.querySelector(".track");
      const cov=n.querySelector(".cover");
      const name=n.querySelector(".track-name");
      const art=n.querySelector(".track-artist");
      const tm=n.querySelector(".time");
      const fv=n.querySelector(".fav");
      const fsvg=fv.querySelector("svg");

      if(track.pic) cov.style.backgroundImage="url("+track.pic+")"; else cov.textContent="♫";
      name.textContent=track.title;
      art.textContent=track.artist;
      tm.textContent=fmt(track.dur);

      if(fav.has(track.id)){ fv.classList.add("active"); fsvg.setAttribute("fill","currentColor"); }
      fv.onclick=e=>{
        e.stopPropagation();
        if(fav.has(track.id)){ fav.delete(track.id); fv.classList.remove("active"); fsvg.setAttribute("fill","none"); }
        else { fav.add(track.id); fv.classList.add("active"); fsvg.setAttribute("fill","currentColor"); }
        localStorage.setItem(FKEY, JSON.stringify([...fav]));
        if(favsec.classList.contains("hidden")===false) renderFav();
      }

      row.onclick=()=>play(track,row);
      cont.appendChild(row);
      return row;
    }

    async function load(){
      try {
        const url = "https://corsproxy.io/?" + encodeURIComponent("https://api.deezer.com/chart/0/tracks?limit=30");
        const r = await fetch(url);
        const j = await r.json();
        if(j.data){
          list = j.data.map(t=>({
            id: "dz_"+t.id,
            title: t.title,
            artist: t.artist.name,
            pic: t.album.cover_medium,
            dur: t.duration,
            src: t.preview
          }));
          chart.innerHTML="";
          list.forEach(x=>mk(x,chart));
          status.textContent = "Онлайн-каталог загружен";
          return;
        }
      }catch(e){}
      status.textContent = "Не удалось загрузить каталог";
    }

    function play(track,row){
      document.querySelectorAll(".track").forEach(x=>x.classList.remove("active"));
      row.classList.add("active");
      current=track;
      pname.textContent=track.title;
      partist.textContent=track.artist;
      if(track.pic) pcover.style.backgroundImage="url("+track.pic+")"; else { pcover.style.backgroundImage="none"; pcover.textContent="♫"; }
      aud.src=track.src;
      aud.play().then(()=>{
        pplay.classList.add("hidden"); ppause.classList.remove("hidden");
      }).catch(()=>{
        pplay.classList.remove("hidden"); ppause.classList.add("hidden");
      });
    }

    pp.onclick=()=>{
      if(!current && list.length){ const r=chart.querySelector(".track"); play(list[0],r); return; }
      if(aud.paused){ aud.play(); pplay.classList.add("hidden"); ppause.classList.remove("hidden"); }
      else { aud.pause(); pplay.classList.remove("hidden"); ppause.classList.add("hidden"); }
    }
    aud.onplay=()=>{pplay.classList.add("hidden"); ppause.classList.remove("hidden");}
    aud.onpause=()=>{pplay.classList.remove("hidden"); ppause.classList.add("hidden");}
    aud.onended=()=>{pplay.classList.remove("hidden"); ppause.classList.add("hidden");}

    btnFav.onclick=()=>{
      if(favsec.classList.contains("hidden")){
        home.classList.add("hidden"); searchsec.classList.add("hidden"); favsec.classList.remove("hidden");
        btnFav.classList.add("active"); btnSet.classList.remove("active");
        renderFav();
      }else{
        home.classList.remove("hidden"); searchsec.classList.add("hidden"); favsec.classList.add("hidden");
        btnFav.classList.remove("active");
      }
    }

    function renderFav(){
      favs.innerHTML="";
      const all=[...list];
      fav.forEach(id=>{
        const t=all.find(x=>x.id===id);
        if(t) mk(t,favs);
      });
    }

    let tmr=null;
    q.oninput=()=>{
      clearTimeout(tmr);
      const v=q.value.trim().toLowerCase();
      if(!v){
        home.classList.remove("hidden"); searchsec.classList.add("hidden"); favsec.classList.add("hidden");
        btnFav.classList.remove("active");
        return;
      }
      home.classList.add("hidden"); favsec.classList.add("hidden"); searchsec.classList.remove("hidden");
      btnFav.classList.remove("active");
      tmr=setTimeout(()=>{
        results.innerHTML="";
        const res=list.filter(x=>x.title.toLowerCase().includes(v)||x.artist.toLowerCase().includes(v));
        res.forEach(x=>mk(x,results));
      },200);
    }

    load();
  </script>
</body>

</html>
